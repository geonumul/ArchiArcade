<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!--
    오락실 조작판. 왼쪽 볼탑 조이스틱, 오른쪽 컬러 버튼.

    파비콘은 16px 로도 읽혀야 하므로 곡선 없이 사각형만 쓴다. 색은 원본 CSS 변수와
    같은 값만 쓴다: bg 14162b, border e8e6f0, yellow ffd93d, red ff5a5a,
    blue 4fc4ff, green 3ee06c.

    주의: XML 주석 안에는 하이픈 두 개를 연달아 쓸 수 없다. 여기에 CSS 변수 이름을
    그대로 적었다가 파일 전체가 파싱 실패해 아이콘이 아예 안 뜬 적이 있다.

    조이스틱을 가운데 두지 않은 이유는 버튼 놓을 자리가 없어져서다. 버튼이 없으면
    색을 넣을 자리도 없다.

    외부 아이콘을 받아 쓰지 않은 이유: 라이선스가 붙고, 안티에일리어싱된 그림은
    16px 로 줄이면 뭉개져 오히려 안 읽힌다.
  -->
  <rect width="32" height="32" fill="#14162b"/>

  <!-- 볼탑(빨강). 사각형 세 장을 겹쳐 둥근 느낌만 낸다 -->
  <rect x="7" y="4"  width="6"  height="2" fill="#ff5a5a"/>
  <rect x="6" y="6"  width="8"  height="4" fill="#ff5a5a"/>
  <rect x="7" y="10" width="6"  height="2" fill="#ff5a5a"/>
  <!-- 반사광 한 칸. 이것만으로 플라스틱 느낌이 생긴다 -->
  <rect x="8" y="6"  width="2"  height="2" fill="#e8e6f0"/>

  <!-- 샤프트 -->
  <rect x="9" y="12" width="3" height="6" fill="#e8e6f0"/>

  <!-- 조작판 -->
  <rect x="2" y="18" width="28" height="8" fill="#ffd93d"/>
  <!-- 앞면을 한 칸 어둡게. 평평한 노란 덩어리로 보이지 않게 한다 -->
  <rect x="2" y="24" width="28" height="2" fill="#b8860b"/>

  <!-- 버튼 두 개 -->
  <rect x="17" y="19" width="5" height="4" fill="#4fc4ff"/>
  <rect x="24" y="19" width="5" height="4" fill="#3ee06c"/>

  <!-- 바닥선 -->
  <rect x="1" y="28" width="30" height="2" fill="#e8e6f0"/>
</svg>
